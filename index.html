<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="robots" content="noindex"><title>صورة ملفك · مشهد</title>
<style>
:root{--bg:#07090F;--ink:#F3F2EF;--sub:#9A9AA2;--gold:#F5C518;--cream:#EAD8BD;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(420px 300px at 50% 0,rgba(245,197,24,.13),transparent),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;padding:30px 20px 40px}
h1{margin:0;font-size:32px;font-weight:600;color:var(--cream)}p{margin:8px 0 22px;color:var(--sub);font-size:16px;line-height:1.7;text-align:center}
.pick{display:block;width:100%;max-width:340px;padding:17px;border-radius:16px;text-align:center;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:18px;font-weight:600}
input[type=file]{display:none}
#wrap{display:none;width:100%;max-width:340px;margin-top:20px}
canvas{display:block;width:100%;aspect-ratio:1;border-radius:20px;background:#111;touch-action:none;box-shadow:0 0 0 2px var(--gold)}
label{display:block;margin:18px 2px 8px;color:var(--sub);font-size:14px}input[type=range]{width:100%;accent-color:var(--gold)}
button{width:100%;margin-top:20px;padding:17px;border:0;border-radius:30px;background:var(--gold);color:#0A101B;font:inherit;font-size:19px;font-weight:700}button:disabled{opacity:.5}
#msg{min-height:26px;margin-top:18px;font-size:16px;text-align:center;color:var(--cream)}
</style></head><body>
<h1>صورة ملفك</h1><p id="hint">اختر صورة، وحرّكها وكبّرها داخل المربع.</p>
<label class="pick" for="f">اختيار صورة</label><input type="file" id="f" accept="image/*">
<div id="wrap"><canvas id="cv" width="512" height="512"></canvas><label for="zm">التكبير</label><input type="range" id="zm" min="1" max="4" step="0.01" value="1"><button id="go">إرسال</button></div>
<div id="msg"></div>
<script>
const URLBASE='https://ufpkwyfduajkhzsyplbb.supabase.co/rest/v1/rpc/photo_put',KEY='sb_publishable_l9eK_hjQnfY9YzAvigOcBg_ej5hq04H';
const code=new URLSearchParams(location.hash.slice(1)).get('c')||'';const g=i=>document.getElementById(i),cv=g('cv'),cx=cv.getContext('2d'),msg=g('msg');
if(code.length<24){g('hint').textContent='افتح هذي الصفحة بمسح الرمز من مشهد.';document.querySelector('.pick').style.display='none'}
let im=null,z=1,ox=0,oy=0,pinch=0,pz=1;const pts=new Map();
function draw(){if(!im)return;const b=512/Math.min(im.width,im.height)*z,w=im.width*b,h=im.height*b;ox=Math.min(0,Math.max(512-w,ox));oy=Math.min(0,Math.max(512-h,oy));cx.imageSmoothingQuality='high';cx.drawImage(im,ox,oy,w,h)}
function zoom(n){if(!im)return;n=Math.min(4,Math.max(1,n));const k=n/z;ox=256-(256-ox)*k;oy=256-(256-oy)*k;z=n;g('zm').value=n;draw()}
g('f').onchange=e=>{const f=e.target.files[0];if(!f)return;msg.textContent='';const i=new Image();i.onload=()=>{im=i;z=1;g('zm').value=1;const b=512/Math.min(i.width,i.height);ox=(512-i.width*b)/2;oy=(512-i.height*b)*.12;g('wrap').style.display='block';draw()};i.onerror=()=>msg.textContent='ما قدرت أفتح هذي الصورة، جرّب صورة ثانية';i.src=URL.createObjectURL(f)};
g('zm').oninput=e=>zoom(+e.target.value);
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size==2){const a=[...pts.values()];pinch=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);pz=z}};
cv.onpointermove=e=>{const p=pts.get(e.pointerId);if(!p||!im)return;const s=512/cv.clientWidth;if(pts.size==1){ox+=(e.clientX-p[0])*s;oy+=(e.clientY-p[1])*s;draw()}pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size==2&&pinch){const a=[...pts.values()];zoom(pz*Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])/pinch)}};
cv.onpointerup=cv.onpointercancel=e=>{pts.delete(e.pointerId);pinch=0};
g('go').onclick=async()=>{const b=g('go');b.disabled=true;msg.textContent='يرسل…';try{const image=cv.toDataURL('image/jpeg',.88).split(',')[1];const r=await fetch(URLBASE,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_code:code,p_image:image})});msg.textContent=r.ok?'وصلت، اضغط حفظ في مشهد':'ما وصلت، جرّب مرة ثانية'}catch(e){msg.textContent='ما وصلت، تأكد من النت'}b.disabled=false};
</script></body></html>
